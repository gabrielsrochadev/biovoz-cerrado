<${Card} t="Quanto volta para cada família" ic="Users"><div style=${{height:230}}><${R.ResponsiveContainer} width="100%" height="100%"><${R.BarChart} data=${d2}><${R.XAxis} dataKey="k" tick=${tk} stroke="var(--line)"/><${R.YAxis} tick=${tk} stroke="var(--line)" width=${56}/><${R.Tooltip} formatter=${v=>brl(v)} contentStyle=${{background:'var(--card)',border:'1px solid var(--line)',color:'var(--ink)'}}/><${R.Bar} dataKey="v" fill="var(--au)" radius=${[6,6,0,0]}/></${R.BarChart}></${R.ResponsiveContainer}></div>
<div class="grid sm:grid-cols-2 gap-x-6 mt-2 text-sm">${P.map((p,i)=>html`<div key=${p.n} class="flex justify-between py-1 border-b border-line"><span>${p.n} <span class="text-xs text-mute">(${(p.kg/tot*100).toFixed(1)}%)</span></span><b>${brl(d2[i].v)}</b></div>`)}</div>
<p class="text-xs text-mute mt-3">Fórmula: (venda B2B − take rate − frete) × (kg líquidos da família ÷ kg líquidos do lote).</p></${Card}><${Card} t="Vendas pela Vitrine B2B" ic="Send">${ledger.length?html`<ul class="divide-y divide-line text-sm">${ledger.map(x=>html`<li key=${x.id} class="py-2 flex flex-wrap justify-between gap-2"><span>Lote #${x.id} · ${x.prod} · ${x.buyer}</span><span class="text-mute">Venda ${brl(x.gross)} · take rate −${brl(x.take)} · <b class="text-g7">famílias +${brl(x.net)}</b></span></li>`)}</ul>`:html`<p class="text-sm text-mute">Nenhuma venda pela Vitrine B2B ainda.</p>`}</${Card}></div>`}
</div>
<aside class="space-y-3 lg:sticky lg:top-4"><${Card} t="Simulador Fricção Zero" ic="Mic" right=${html`<${Ic} n="Wifi" c="text-g7"/>`}>
<p class="text-xs text-mute mb-2">Áudio do produtor no WhatsApp (offline) → IA → painel.</p>
<textarea value=${txt} onInput=${e=>setTxt(e.target.value)} rows="4" class="w-full rounded-lg border border-line bg-bg p-2 text-sm"></textarea>
<div class="flex gap-2 mt-2"><${Btn} disabled=${!!busy||sold} onClick=${sim}><${Ic} n="Mic"/>Simular Recebimento de Áudio</${Btn}><${Btn} tone="o" onClick=${reset} title="Reiniciar demonstração"><${Ic} n="RotateCcw"/></${Btn}></div>
${busy&&html`<div class="mt-3 text-sm flex items-center gap-2 text-g7"><span class="pu w-2 h-2 rounded-full bg-au"></span>${busy}</div>`}
${res&&res.err&&html`<p class="mt-3 text-sm text-au">Não encontrei o peso colhido. Use algo como “colhi 160kg”.</p>`}
${res&&!res.err&&html`<div class="mt-3 rounded-xl bg-g1 p-3 text-sm space-y-1"><div class="font-semibold flex items-center gap-2"><${Ic} n="CheckCircle2" c="text-g7"/>Variáveis extraídas</div><div>Produtor: <b>${res.n}</b></div><div>${res.g} kg − ${res.l} kg perda = <b>${res.net} kg líquidos</b> · frete ${brl(res.f)}</div><div class="rounded-lg bg-card p-2 text-xs mt-1">🤖 “${res.n}, lote de ${res.net} kg líquidos registrado! Descontando perdas e frete, sua margem estimada é ${brl(res.m)}.”</div></div>`}
</${Card}><p class="text-xs text-mute px-1">Protótipo com dados de demonstração. Integrações reais (WhatsApp API, IA, CAR/CAF) ainda são proposta.</p></aside>
</div></main>`}
${modal&&cert&&html`<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4" onClick=${()=>setModal(false)}><div class="bg-card border border-line rounded-2xl max-w-md w-full p-5 max-h-full overflow-y-auto" onClick=${e=>e.stopPropagation()}>
<div class="flex justify-between items-start"><div><div class="text-xs text-au font-semibold tracking-wide">CERTIFICADO DIGITAL</div><div class="text-xl font-bold">Bioma KM 0</div></div><button onClick=${()=>setModal(false)} aria-label="Fechar"><${Ic} n="X"/></button></div>
<div class="flex gap-4 items-center my-4"><${Qr} h=${cert.h}/><div class="text-sm space-y-1"><div><b>Lote:</b> ${cert.id} · Babaçu</div><div><b>Volume:</b> ${kg(tot)} kg líquidos</div><div><b>Origem:</b> ${coop} · ${P.length} famílias</div><div><b>Emitido:</b> ${cert.ts}</div></div></div>
<div class="text-xs text-mute">Hash de auditoria (cadeia imutável)</div><div class="font-mono text-xs break-all rounded-lg bg-g1 p-2">${cert.h}</div>
<div class="flex items-center gap-3 mt-4"><${Btn} tone="o" onClick=${()=>setVer(hx(JSON.stringify(lotes)+coop)===cert.h)}><${Ic} n="ShieldCheck"/>Verificar integridade</${Btn}>${ver!==null&&html`<span class=${'text-sm font-medium '+(ver?'text-g7':'text-au')}>${ver?'Íntegro: hash confere com os registros.':'Registros alterados!'}</span>`}</div></div></div>`}
${buyL&&html`<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4" onClick=${()=>setBuyM(null)}><div class="bg-card border border-line rounded-2xl max-w-md w-full p-5 max-h-full overflow-y-auto" onClick=${e=>e.stopPropagation()}><div class="flex justify-between"><div class="text-xl font-bold">Fechamento de compra</div><button onClick=${()=>setBuyM(null)} aria-label="Fechar"><${Ic} n="X"/></button></div><p class="text-sm text-mute mb-3">Lote Master #${buyL.id} — ${buyL.prod} · ${by.n}</p><div class="rounded-xl bg-g1 p-3 text-sm mb-3">1 tonelada consolidada (${kg(buyL.kg)} kg) + <b>1 NF-e Unificada</b> emitida pela ${buyL.coop}.</div><div class="text-sm space-y-1.5">${[['Valor do lote',brl(bg)],['Take rate BioVoz ('+rate+'%)','− '+brl(bt)],['Frete e custos coletivos','− '+brl(bc)],['Líquido direto para o rateio das famílias',brl(bn)]].map(([a,v],i)=>html`<div key=${a} class=${'flex justify-between rounded-lg px-2 py-1 '+(i==3?'bg-au1 font-bold':'')}><span>${a}</span><span>${v}</span></div>`)}</div><p class="text-xs text-mute mt-2">Transparência: o take rate é a taxa de sucesso da BioVoz, cobrada apenas na emissão da NF. O restante é rateado proporcionalmente entre as ${buyL.fam} famílias.</p><div class="mt-4 flex flex-wrap gap-2 justify-end"><${Btn} tone="o" onClick=${()=>setBuyM(null)}>Cancelar</${Btn}><${Btn} tone="a" onClick=${confirmBuy}>Confirmar Compra e Emitir NF Unificada</${Btn}></div></div></div>`}
${dosL&&html`<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4" onClick=${()=>setDosM(null)}><div class="bg-card border border-line rounded-2xl max-w-md w-full p-5 max-h-full overflow-y-auto" onClick=${e=>e.stopPropagation()}><div class="flex justify-between"><div><div class="text-xs text-au font-semibold">DOSSIÊ DE RASTREABILIDADE</div><div class="text-xl font-bold">Lote #${dosL.id} · ${dosL.prod}</div></div><button onClick=${()=>setDosM(null)} aria-label="Fechar"><${Ic} n="X"/></button></div><div class="flex gap-4 items-center my-3"><${Qr} h=${hx('lote'+dosL.id)}/><div class="text-sm space-y-1"><div><b>Origem:</b> ${dosL.coop} · Balsas/MA</div><div><b>Área preservada:</b> ${dosL.ha} ha (CAR)</div><div><b>Famílias:</b> ${dosL.fam} com CAF ativo</div></div></div><table class="w-full text-sm"><tbody>${FAM.map(f=>html`<tr key=${f[0]} class="border-b border-line"><td class="py-1.5">${f[0]}</td><td class="text-mute">${f[1]}</td><td><${Chip} ok=${true} a="CAF" b=""/></td><td><${Chip} ok=${true} a="CAR" b=""/></td></tr>`)}</tbody></table><p class="text-xs text-mute mt-2">Amostra de 5 de ${dosL.fam} famílias. Dados pessoais anonimizados (LGPD): a vitrine mostra só dados do lote.</p><p class="text-xs mt-2 break-all"><span class="text-mute">Hash de auditoria:</span> <span class="font-mono">${hx('lote'+dosL.id)}</span></p><div class="mt-3"><${Btn} onClick=${()=>{setCs({sel:dosL.id,view:'cert',q:null});setDosM(null);setMode(2)}}><${Ic} n="FileCheck"/>Abrir certificado Bioma KM 0</${Btn}></div></div></div>`}
${ordM&&html`<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4" onClick=${()=>setOrdM(false)}><div class="bg-card border border-line rounded-2xl max-w-md w-full p-5" onClick=${e=>e.stopPropagation()}><div class="text-xl font-bold">+ Lançar Ordem de Compra ESG</div><div class="space-y-3 mt-3 text-sm"><label class="block">Produto<select value=${fm.prod} onChange=${e=>setFm({...fm,prod:e.target.value})} class="mt-1 w-full rounded-lg border border-line bg-bg text-ink p-2"><option>Buriti</option><option>Babaçu</option></select></label><label class="block">Quantidade (kg)<input type="number" min="100" step="100" value=${fm.kg} onChange=${e=>setFm({...fm,kg:e.target.value})} class="mt-1 w-full rounded-lg border border-line bg-bg text-ink p-2"/></label><label class="block">Prazo<input type="date" min="2026-11-13" value=${fm.dl} onChange=${e=>setFm({...fm,dl:e.target.value})} class="mt-1 w-full rounded-lg border border-line bg-bg text-ink p-2"/></label><p class="text-xs text-mute">Ex.: “Preciso de 1.000 kg de Buriti para meta de Insetting até dia 30”.</p></div><div class="mt-4 flex gap-2 justify-end"><${Btn} tone="o" onClick=${()=>setOrdM(false)}>Cancelar</${Btn}><${Btn} tone="a" disabled=${!(+fm.kg>0)||!fm.dl} onClick=${addOrder}>Confirmar ordem</${Btn}></div></div></div>`}
${mode==2&&ddx&&html`<div class="no-print fixed inset-0 z-50 bg-black/60 grid place-items-center p-4" onClick=${()=>setCs({dd:null})}><div class="bg-card border border-line rounded-2xl max-w-md w-full p-5 max-h-full overflow-y-auto" onClick=${e=>e.stopPropagation()}><div class="flex justify-between items-start gap-3"><div><div class="text-xs text-au font-semibold tracking-wide">ENTREGA</div><div class="text-lg font-bold break-all">${ddx.code}</div></div><button onClick=${()=>setCs({dd:null})} aria-label="Fechar"><${Ic} n="X"/></button></div>
<dl class="mt-3 text-sm space-y-1.5">${[['Data',ISO(ddx.d)],['Peso bruto',ddx.g+' kg'],['Perda na quebra',ddx.loss+' kg ('+(ddx.loss/ddx.g*100).toFixed(1).replace('.',',')+'%)'],['Peso líquido',ddx.net+' kg'],['Situação',ddx.conf?'Confirmado pela cooperativa':'Declarado pelo produtor'],['Produtor','Não exibido (anonimizado, LGPD)']].map(([a,v])=>html`<div key=${a} class="flex justify-between gap-3 border-b border-line pb-1.5"><dt class="text-mute">${a}</dt><dd class="font-medium text-right">${v}</dd></div>`)}</dl>
<div class="mt-3 text-xs text-mute">Hash da entrega (SHA-256)</div><div class="font-mono text-[11px] break-all rounded-lg bg-g1 p-2">${ddx.hash}</div>
<div class="mt-4 flex justify-end gap-2">${!ddx.conf&&cur.key=='live'&&html`<${Btn} onClick=${()=>confirmDel(ddx.k)}><${Ic} n="PackageCheck"/>Confirmar recebimento e peso</${Btn}>`}<${Btn} tone="o" onClick=${()=>setCs({dd:null})}>Fechar</${Btn}></div></div></div>`}
${toast&&html`<div class="no-print fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-g9 text-white text-sm rounded-xl px-4 py-2 shadow-lg">${toast}</div>`}
</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>

</body></html>
