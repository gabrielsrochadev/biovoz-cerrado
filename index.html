<script>
const {useState,useMemo}=React,R=Recharts,L=window.LucideReact||{},html=htm.bind(React.createElement);

function App(){
const [coop,setCoop]=useState('COOPEVIDA'),[tab,setTab]=useState(0),[lotes,setLotes]=useState(SEED),[txt,setTxt]=useState(EX),[busy,setBusy]=useState(''),[res,setRes]=useState(null),[cert,setCert]=useState(null),[modal,setModal]=useState(false),[ver,setVer]=useState(null),[buyer,setBuyer]=useState(0),[sold,setSold]=useState(false),[rate,setRate]=useState(6),[toast,setToast]=useState(''),[mode,setMode]=useState(0),[lots,setLots]=useState(LOTS0),[ledger,setLedger]=useState([]),[orders,setOrders]=useState([]),[buyM,setBuyM]=useState(null),[dosM,setDosM]=useState(null),[ordM,setOrdM]=useState(false),[fm,setFm]=useState({prod:'Buriti',kg:1000,dl:'2026-11-30'});

const ext=ledger.reduce((s,x)=>s+x.net,0),buyL=lots.find(l=>l.id==buyM),dosL=lots.find(l=>l.id==dosM),bg=buyL?buyL.kg*buyL.p:0,bt=bg*rate/100,bc=420,bn=bg-bt-bc;

const ordsUI=list=>html`<${Card} t="Metas de captação · Ordens de Compra ESG" ic="Target" right=${html`<span class="text-xs text-mute">${list.length} ativa(s)</span>`}><div class="space-y-3">${list.map(o=>html`<div key=${o.id}><div class="flex justify-between gap-2 text-sm"><span class="font-medium">${o.id} · ${o.buyer} · ${o.prod}</span><span class="text-mute whitespace-nowrap">${kg(o.got)} / ${kg(o.kg)} kg</span></div><div class="h-2.5 rounded-full bg-g1 overflow-hidden my-1"><div class="h-full bg-au transition-all duration-700" style=${{width:Math.min(100,o.got/o.kg*100)+'%'}}></div></div><div class="text-xs text-mute">Prazo ${o.dl.split('-').reverse().join('/')} · extrativistas reportam pelo WhatsApp (ex.: “colhi 200kg de ${o.prod.toLowerCase()}”)</div></div>`)}</div></${Card}>`;

<div class="grid sm:grid-cols-3 gap-3">${[['Boxes','Toneladas adquiridas no Cerrado',(12+mine.reduce((s,x)=>s+x.kg/1000,0)).toFixed(1).replace('.',',')+' t'],['TreePine','Área preservada auditada (CAR)',kg(1840+mine.reduce((s,x)=>s+x.ha,0))+' ha'],['Users','Famílias beneficiadas diretamente',String(86+mine.reduce((s,x)=>s+x.fam,0))]].map(([i,a,v])=>html`<div key=${a} class="bg-card border border-line rounded-2xl p-4"><div class="flex items-center gap-2 text-xs text-mute"><${Ic} n=${i} c="text-au"/>${a}</div><div class="text-2xl font-bold mt-1">${v}</div><div class="text-xs text-mute">Insetting no território · dados de demonstração</div></div>`)}</div>

<${Card} t="Fluxo inverso · Pedido sob demanda" ic="Target" right=${html`<${Btn} tone="a" onClick=${()=>setOrdM(true)}>+ Lançar Ordem de Compra ESG</${Btn}>`}><p class="text-sm text-mute">Precisa de um volume específico? Lance uma ordem: a meta aparece para a cooperativa, e os extrativistas completam pelo WhatsApp.</p></${Card}>
${mo.length>0&&ordsUI(mo)}</main>`};

return html`<div class="min-h-screen">

<div class="flex flex-wrap items-center gap-3"><div class="flex rounded-lg bg-white/10 p-1 text-sm">${['Gestão da Cooperativa','Vitrine B2B (Comprador)'].map((t,k)=>html`<button key=${t} onClick=${()=>setMode(k)} class=${'rounded-md px-3 py-1.5 font-medium '+(mode==k?'bg-au text-[#2b1d00]':'text-white/80 hover:bg-white/10')}>${t}</button>`)}</div><span class=${'inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1.5 text-xs'+(mode?' hidden':'')}><span class="pu w-2 h-2 rounded-full bg-emerald-400"></span><${Ic} n="MessageCircle" s=${14}/>Bot WhatsApp online · Sincronização offline assíncrona ativa</span>

${mode==1?buyerUI():html`<main class="max-w-7xl mx-auto px-4 py-5 space-y-5">

<${Card} t="Micro-lotes captados por voz" ic="Mic" right=${html`<span class="text-xs text-mute">${lotes.length} áudios</span>`}><ul class="divide-y divide-line max-h-72 overflow-y-auto">${[...lotes].reverse().map(l=>html`<li key=${l.id} class="py-2 flex items-center justify-between gap-3 text-sm"><div class="min-w-0"><div class="font-medium truncate">${l.n}</div><div class="text-xs text-mute">${l.t} · ${l.g} kg − ${l.l} kg perda · frete ${brl(l.f)} · ${l.src}</div></div><div class="font-bold text-g7 whitespace-nowrap">+${l.net} kg</div></li>`)}</ul></${Card}></div>`}
${tab==1&&html`<${Card} t="Rastreador Bioma KM 0" ic="QrCode" right=${html`<${Btn} disabled=${!cert&&!canEmit} onClick=${()=>cert?(setVer(null),setModal(true)):emit()}><${Ic} n="BadgeCheck"/>${cert?'Ver certificado':'Gerar certificado'}</${Btn}>`}><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs text-mute border-b border-line"><th class="py-2">Produtor</th><th>Comunidade</th><th class="text-right">Vol. líquido</th><th class="pl-4">CAF</th><th>CAR (área preservada)</th></tr></thead><tbody>${P.map(p=>html`<tr key=${p.n} class="border-b border-line"><td class="py-2 font-medium">${p.n}</td><td>${p.com}</td><td class="text-right font-semibold">${kg(p.kg)} kg</td><td class="pl-4"><${Chip} ok=${p.ok} a="Validado" b="Em validação"/></td><td><${Chip} ok=${p.ok} a="Preservada" b="Pendente"/></td></tr>`)}</tbody></table></div>${cert&&html`<p class="mt-3 text-xs text-mute break-all">Hash de auditoria: <span class="font-mono text-ink">${cert.h}</span></p>`}</${Card}>`}
${tab==2&&html`<div class="space-y-4"><${Card} t=${'Rateio do Lote Master · '+(sold?'efetivado':'projeção com '+by.n)} ic="Wallet" right=${html`<${Chip} ok=${sold} a="NF emitida" b="Projeção"/>`}>
<label class="flex flex-wrap items-center gap-3 text-sm mb-3">Take rate da plataforma: <b>${rate}%</b><input type="range" min="3" max="10" step="0.5" value=${rate} disabled=${sold} onInput=${e=>setRate(+e.target.value)} class="accent-[#d99a1e]"/><span class="text-xs text-mute">parâmetro configurável (percentual ainda a definir)</span></label>
<div style=${{height:230}}><${R.ResponsiveContainer} width="100%" height="100%"><${R.BarChart} data=${d1}><${R.XAxis} dataKey="k" tick=${tk} stroke="var(--line)"/><${R.YAxis} tick=${tk} stroke="var(--line)" width=${56} tickFormatter=${v=>(v/1000).toFixed(0)+'k'}/><${R.Tooltip} formatter=${v=>brl(v)} contentStyle=${{background:'var(--card)',border:'1px solid var(--line)',color:'var(--ink)'}}/><${R.Bar} dataKey="v" radius=${[6,6,0,0]}>${d1.map((x,i)=>html`<${R.Cell} key=${i} fill=${x.c}/>`)}</${R.Bar}></${R.BarChart}></${R.ResponsiveContainer}></div></${Card}>
<${Card} t="Quanto volta para cada família" ic="Users"><div style=${{height:230}}><${R.ResponsiveContainer} width="100%" height="100%"><${R.BarChart} data=${d2}><${R.XAxis} dataKey="k" tick=${tk} stroke="var(--line)"/><${R.YAxis} tick=${tk} stroke="var(--line)" width=${56}/><${R.Tooltip} formatter=${v=>brl(v)} contentStyle=${{background:'var(--card)',border:'1px solid var(--line)',color:'var(--ink)'}}/><${R.Bar} dataKey="v" fill="var(--au)" radius=${[6,6,0,0]}/></${R.BarChart}></${R.ResponsiveContainer}></div>
<div class="grid sm:grid-cols-2 gap-x-6 mt-2 text-sm">${P.map((p,i)=>html`<div key=${p.n} class="flex justify-between py-1 border-b border-line"><span>${p.n} <span class="text-xs text-mute">(${(p.kg/tot*100).toFixed(1)}%)</span></span><b>${brl(d2[i].v)}</b></div>`)}</div>
<p class="text-xs text-mute mt-3">Fórmula: (venda B2B − take rate − frete) × (kg líquidos da família ÷ kg líquidos do lote).</p></${Card}><${Card} t="Vendas pela Vitrine B2B" ic="Send">${ledger.length?html`<ul class="divide-y divide-line text-sm">${ledger.map(x=>html`<li key=${x.id} class="py-2 flex flex-wrap justify-between gap-2"><span>Lote #${x.id} · ${x.prod} · ${x.buyer}</span><span class="text-mute">Venda ${brl(x.gross)} · take rate −${brl(x.take)} · <b class="text-g7">famílias +${brl(x.net)}</b></span></li>`)}</ul>`:html`<p class="text-sm text-mute">Nenhuma venda pela Vitrine B2B ainda.</p>`}</${Card}></div>`}
</div>
<aside class="space-y-3 lg:sticky lg:top-4"><${Card} t="Simulador Fricção Zero" ic="Mic" right=${html`<${Ic} n="Wifi" c="text-g7"/>`}>
<p class="text-xs text-mute mb-2">Áudio do produtor no WhatsApp (offline) → IA → painel.</p>
<textarea value=${txt} onInput=${e=>setTxt(e.target.value)} rows="4" class="w-full rounded-lg border border-line bg-bg p-2 text-sm"></textarea>
<div class="flex gap-2 mt-2"><${Btn} disabled=${!!busy||sold} onClick=${sim}><${Ic} n="Mic"/>Simular Recebimento de Áudio</${Btn}><${Btn} tone="o" onClick=${reset} title="Reiniciar demonstração"><${Ic} n="RotateCcw"/></${Btn}></div>
${busy&&html`<div class="mt-3 text-sm flex items-center gap-2 text-g7"><span class="pu w-2 h-2 rounded-full bg-au"></span>${busy}</div>`}
${res&&res.err&&html`<p class="mt-3 text-sm text-au">Não encontrei o peso colhido. Use algo como “colhi 160kg”.</p>`}
${res&&!res.err&&html`<div class="mt-3 rounded-xl bg-g1 p-3 text-sm space-y-1"><div class="font-semibold flex items-center gap-2"><${Ic} n="CheckCircle2" c="text-g7"/>Variáveis extraídas</div><div>Produtor: <b>${res.n}</b></div><div>${res.g} kg − ${res.l} kg perda = <b>${res.net} kg líquidos</b> · frete ${brl(res.f)}</div><div class="rounded-lg bg-card p-2 text-xs mt-1">🤖 “${res.n}, lote de ${res.net} kg líquidos registrado! Descontando perdas e frete, sua margem estimada é ${brl(res.m)}.”</div></div>`}
</${Card}><p class="text-xs text-mute px-1">Protótipo com dados de demonstração. Integrações reais (WhatsApp API, IA, CAR/CAF) ainda são proposta.</p></aside>
</div></main>`}
${modal&&cert&&html`<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4" onClick=${()=>setModal(false)}><div class="bg-card border border-line rounded-2xl max-w-md w-full p-5 max-h-full overflow-y-auto" onClick=${e=>e.stopPropagation()}>
<div class="flex justify-between items-start"><div><div class="text-xs text-au font-semibold tracking-wide">CERTIFICADO DIGITAL</div><div class="text-xl font-bold">Bioma KM 0</div></div><button onClick=${()=>setModal(false)} aria-label="Fechar"><${Ic} n="X"/></button></div>
<div class="flex gap-4 items-center my-4"><${Qr} h=${cert.h}/><div class="text-sm space-y-1"><div><b>Lote:</b> ${cert.id} · Babaçu</div><div><b>Volume:</b> ${kg(tot)} kg líquidos</div><div><b>Origem:</b> ${coop} · ${P.length} famílias</div><div><b>Emitido:</b> ${cert.ts}</div></div></div>
<div class="text-xs text-mute">Hash de auditoria (cadeia imutável)</div><div class="font-mono text-xs break-all rounded-lg bg-g1 p-2">${cert.h}</div>
<div class="flex items-center gap-3 mt-4"><${Btn} tone="o" onClick=${()=>setVer(hx(JSON.stringify(lotes)+coop)===cert.h)}><${Ic} n="ShieldCheck"/>Verificar integridade</${Btn}>${ver!==null&&html`<span class=${'text-sm font-medium '+(ver?'text-g7':'text-au')}>${ver?'Íntegro: hash confere com os registros.':'Registros alterados!'}</span>`}</div></div></div>`}
${buyL&&html`<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4" onClick=${()=>setBuyM(null)}><div class="bg-card border border-line rounded-2xl max-w-md w-full p-5 max-h-full overflow-y-auto" onClick=${e=>e.stopPropagation()}><div class="flex justify-between"><div class="text-xl font-bold">Fechamento de compra</div><button onClick=${()=>setBuyM(null)} aria-label="Fechar"><${Ic} n="X"/></button></div><p class="text-sm text-mute mb-3">Lote Master #${buyL.id} — ${buyL.prod} · ${by.n}</p><div class="rounded-xl bg-g1 p-3 text-sm mb-3">1 tonelada consolidada (${kg(buyL.kg)} kg) + <b>1 NF-e Unificada</b> emitida pela ${buyL.coop}.</div><div class="text-sm space-y-1.5">${[['Valor do lote',brl(bg)],['Take rate BioVoz ('+rate+'%)','− '+brl(bt)],['Frete e custos coletivos','− '+brl(bc)],['Líquido direto para o rateio das famílias',brl(bn)]].map(([a,v],i)=>html`<div key=${a} class=${'flex justify-between rounded-lg px-2 py-1 '+(i==3?'bg-au1 font-bold':'')}><span>${a}</span><span>${v}</span></div>`)}</div><p class="text-xs text-mute mt-2">Transparência: o take rate é a taxa de sucesso da BioVoz, cobrada apenas na emissão da NF. O restante é rateado proporcionalmente entre as ${buyL.fam} famílias.</p><div class="mt-4 flex flex-wrap gap-2 justify-end"><${Btn} tone="o" onClick=${()=>setBuyM(null)}>Cancelar</${Btn}><${Btn} tone="a" onClick=${confirmBuy}>Confirmar Compra e Emitir NF Unificada</${Btn}></div></div></div>`}
${dosL&&html`<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4" onClick=${()=>setDosM(null)}><div class="bg-card border border-line rounded-2xl max-w-md w-full p-5 max-h-full overflow-y-auto" onClick=${e=>e.stopPropagation()}><div class="flex justify-between"><div><div class="text-xs text-au font-semibold">DOSSIÊ DE RASTREABILIDADE</div><div class="text-xl font-bold">Lote #${dosL.id} · ${dosL.prod}</div></div><button onClick=${()=>setDosM(null)} aria-label="Fechar"><${Ic} n="X"/></button></div><div class="flex gap-4 items-center my-3"><${Qr} h=${hx('lote'+dosL.id)}/><div class="text-sm space-y-1"><div><b>Origem:</b> ${dosL.coop} · Balsas/MA</div><div><b>Área preservada:</b> ${dosL.ha} ha (CAR)</div><div><b>Famílias:</b> ${dosL.fam} com CAF ativo</div></div></div><table class="w-full text-sm"><tbody>${FAM.map(f=>html`<tr key=${f[0]} class="border-b border-line"><td class="py-1.5">${f[0]}</td><td class="text-mute">${f[1]}</td><td><${Chip} ok=${true} a="CAF" b=""/></td><td><${Chip} ok=${true} a="CAR" b=""/></td></tr>`)}</tbody></table><p class="text-xs text-mute mt-2">Amostra de 5 de ${dosL.fam} famílias. Dados pessoais anonimizados (LGPD): a vitrine mostra só dados do lote.</p><p class="text-xs mt-2 break-all"><span class="text-mute">Hash de auditoria:</span> <span class="font-mono">${hx('lote'+dosL.id)}</span></p></div></div>`}
${ordM&&html`<div class="fixed inset-0 z-50 bg-black/60 grid place-items-center p-4" onClick=${()=>setOrdM(false)}><div class="bg-card border border-line rounded-2xl max-w-md w-full p-5" onClick=${e=>e.stopPropagation()}><div class="text-xl font-bold">+ Lançar Ordem de Compra ESG</div><div class="space-y-3 mt-3 text-sm"><label class="block">Produto<select value=${fm.prod} onChange=${e=>setFm({...fm,prod:e.target.value})} class="mt-1 w-full rounded-lg border border-line bg-bg text-ink p-2"><option>Buriti</option><option>Babaçu</option></select></label><label class="block">Quantidade (kg)<input type="number" min="100" step="100" value=${fm.kg} onChange=${e=>setFm({...fm,kg:e.target.value})} class="mt-1 w-full rounded-lg border border-line bg-bg text-ink p-2"/></label><label class="block">Prazo<input type="date" min="2026-11-13" value=${fm.dl} onChange=${e=>setFm({...fm,dl:e.target.value})} class="mt-1 w-full rounded-lg border border-line bg-bg text-ink p-2"/></label><p class="text-xs text-mute">Ex.: “Preciso de 1.000 kg de Buriti para meta de Insetting até dia 30”.</p></div><div class="mt-4 flex gap-2 justify-end"><${Btn} tone="o" onClick=${()=>setOrdM(false)}>Cancelar</${Btn}><${Btn} tone="a" disabled=${!(+fm.kg>0)||!fm.dl} onClick=${addOrder}>Confirmar ordem</${Btn}></div></div></div>`}
${toast&&html`<div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-g9 text-white text-sm rounded-xl px-4 py-2 shadow-lg">${toast}</div>`}
</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
